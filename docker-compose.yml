services:
  vendor-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vendor_db
      POSTGRES_USER: mms_vendor
      POSTGRES_PASSWORD: mms_vendor
    ports:
      - "5433:5432"
    volumes:
      - vendor_db_data:/var/lib/postgresql/data

  procurement-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: mms_procurement
      POSTGRES_PASSWORD: mms_procurement
    ports:
      - "5434:5432"
    volumes:
      - procurement_db_data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: mms_inventory
      POSTGRES_PASSWORD: mms_inventory
    ports:
      - "5435:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data

  inventory-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_test_db
      POSTGRES_USER: mms_inventory
      POSTGRES_PASSWORD: mms_inventory
    ports:
      - "5436:5432"
    tmpfs:
      - /var/lib/postgresql/data

  receiving-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: receiving_db
      POSTGRES_USER: mms_receiving
      POSTGRES_PASSWORD: mms_receiving
    ports:
      - "5437:5432"
    volumes:
      - receiving_db_data:/var/lib/postgresql/data

  warehouse-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: mms_warehouse
      POSTGRES_PASSWORD: mms_warehouse
    ports:
      - "5438:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data

  retail-sales-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retail_sales_db
      POSTGRES_USER: mms_retail
      POSTGRES_PASSWORD: mms_retail
    ports:
      - "5439:5432"
    volumes:
      - retail_sales_db_data:/var/lib/postgresql/data

  sales-audit-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sales_audit_db
      POSTGRES_USER: mms_sales_audit
      POSTGRES_PASSWORD: mms_sales_audit
    ports:
      - "5440:5432"
    volumes:
      - sales_audit_db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: mms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mms
      RABBITMQ_DEFAULT_PASS: mms
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  vendor_db_data:
  procurement_db_data:
  inventory_db_data:
  rabbitmq_data:
  receiving_db_data:
  warehouse_db_data:
  retail_sales_db_data:
  sales_audit_db_data:

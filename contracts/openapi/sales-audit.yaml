openapi: 3.1.0
info:
  title: MMS Sales Audit API
  version: 1.0.0
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - url: /api/v1
security: []
paths:
  /registers:
    get:
      summary: List active Retail Sales registers
      operationId: listRegisters
      responses:
        '200':
          description: Active registers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Register'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sessions:
    get:
      summary: Search register audit sessions
      operationId: listSessions
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: registerId
          schema: {type: string, format: uuid}
        - in: query
          name: status
          schema: {type: string, enum: [OPEN, SUBMITTED, APPROVED, REJECTED, EXCEPTION]}
      responses:
        '200': {description: A paginated session list}
        '400': {$ref: '#/components/responses/ValidationError'}
    post:
      summary: Open a register session
      operationId: openSession
      parameters:
        - {$ref: '#/components/parameters/ActorId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registerId, openingFloatMinor]
              properties:
                registerId: {type: string, format: uuid}
                openingFloatMinor: {type: integer, minimum: 0}
      responses:
        '201': {description: Session opened}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      summary: Read a session with tender totals and transaction references
      operationId: getSession
      responses:
        '200': {description: Register session detail}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sessions/{sessionId}/transactions:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      summary: List source sale and refund facts attributed to a session
      operationId: listSessionTransactions
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200': {description: A paginated list of transaction and tender projections}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sessions/{sessionId}/submit:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - {$ref: '#/components/parameters/ActorId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      summary: Submit counted tender totals for manager review
      operationId: submitSessionClose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedTotals, varianceExplanations]
              properties:
                countedTotals:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: object
                    required: [method, amountMinor]
                    properties:
                      method: {type: string, enum: [CASH, CARD, GIFT_CARD]}
                      amountMinor: {type: integer, minimum: 0}
                varianceExplanations: {type: object, additionalProperties: {type: string, maxLength: 500}}
      responses:
        '201': {description: Close submitted and Retail Sales comparison attempted}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}/reconcile:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - {$ref: '#/components/parameters/ActorId'}
    post:
      summary: Retry comparison against the Retail Sales register totals snapshot
      operationId: reconcileSession
      responses:
        '200': {description: Session and reconciliation state}
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sessions/{sessionId}/approve:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - {$ref: '#/components/parameters/ActorId'}
    post:
      summary: Approve a reconciled close as a separate manager actor
      operationId: approveSession
      responses:
        '201': {description: Close approved}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {description: The submitter cannot approve their own close}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}/reject:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - {$ref: '#/components/parameters/ActorId'}
    post:
      summary: Reject a close with a reason
      operationId: rejectSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201': {description: Close rejected}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {description: The submitter cannot reject their own close}
        '409': {$ref: '#/components/responses/Conflict'}
  /audit-logs:
    get:
      summary: List Sales Audit history
      operationId: listAuditLogs
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: action
          schema: {type: string}
        - in: query
          name: actorId
          schema: {type: string, format: uuid}
      responses:
        '200': {description: A paginated audit history}
        '400': {$ref: '#/components/responses/ValidationError'}
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: {type: string, format: uuid}
    ActorId:
      in: header
      name: x-actor-id
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Register:
      type: object
      required: [id, code, name, inventoryLocationId]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        inventoryLocationId: {type: string, format: uuid}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: {type: string}
            details:
              type: array
              items:
                type: object
                properties:
                  field: {type: string}
                  message: {type: string}
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Invalid session state or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Retail Sales or the database is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://mms_procurement:mms_procurement@localhost:5434/procurement_db
      RABBITMQ_URL: amqp://mms:mms@localhost:5672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Vendor Management
        run: pnpm --filter @mms/vendor-management typecheck

      - name: Typecheck Inventory
        run: pnpm --filter @mms/inventory typecheck

      - name: Typecheck Procurement
        run: pnpm --filter @mms/procurement typecheck

      - name: Build Vendor Management
        run: pnpm --filter @mms/vendor-management build

      - name: Build Inventory
        run: pnpm --filter @mms/inventory build

      - name: Build Procurement
        run: pnpm --filter @mms/procurement build

      - name: Start test infrastructure
        run: docker compose up -d inventory-test-db procurement-db rabbitmq

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T inventory-test-db \
              pg_isready -U mms_inventory -d inventory_test_db >/dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Inventory test database did not become ready"
              docker compose logs inventory-test-db
              exit 1
            fi

            sleep 1
          done

      - name: Wait for Procurement PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T procurement-db \
              pg_isready -U mms_procurement -d procurement_db >/dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Procurement database did not become ready"
              docker compose logs procurement-db
              exit 1
            fi

            sleep 1
          done

      - name: Wait for RabbitMQ
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T rabbitmq \
              rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "RabbitMQ did not become ready"
              docker compose logs rabbitmq
              exit 1
            fi

            sleep 1
          done

      - name: Test Vendor Management
        run: pnpm --filter @mms/vendor-management test

      - name: Test Inventory
        run: pnpm --filter @mms/inventory test

      - name: Run Procurement migrations
        run: pnpm --filter @mms/procurement db:migrate

      - name: Test Procurement
        run: pnpm --filter @mms/procurement test
name: CI

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm openapi:validate

      - name: Typecheck Vendor Management
        run: pnpm --filter @mms/vendor-management typecheck

      - name: Typecheck Inventory
        run: pnpm --filter @mms/inventory typecheck

      - name: Typecheck Procurement
        run: pnpm --filter @mms/procurement typecheck

      - name: Build Vendor Management
        run: pnpm --filter @mms/vendor-management build

      - name: Build Inventory
        run: pnpm --filter @mms/inventory build

      - name: Build Procurement
        run: pnpm --filter @mms/procurement build

      - name: Test Vendor Management
        run: pnpm --filter @mms/vendor-management test

      - name: Start Inventory test infrastructure
        run: docker compose up -d inventory-test-db rabbitmq

      - name: Wait for Inventory test database
        run: |
          for i in {1..30}; do
            if docker compose exec -T inventory-test-db pg_isready -U mms_inventory -d inventory_test_db; then
              exit 0
            fi
            sleep 1
          done
          echo "Inventory test database did not become ready"
          docker compose logs inventory-test-db
          exit 1

      - name: Wait for RabbitMQ
        run: |
          for i in {1..30}; do
            if docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping; then
              exit 0
            fi
            sleep 1
          done
          echo "RabbitMQ did not become ready"
          docker compose logs rabbitmq
          exit 1

      - name: Test Inventory
        run: pnpm --filter @mms/inventory test

      - name: Test Procurement
        run: pnpm --filter @mms/procurement test
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter web lint
      - name: Build frontend
        run: pnpm --filter web build

  backend:
    name: Backend typecheck and build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - '@mms/vendor-management'
          - '@mms/inventory'
          - '@mms/procurement'
          - '@mms/receiving'
          - '@mms/warehouse-operations'
          - '@mms/retail-sales'
          - '@mms/sales-audit'
          - '@mms/financials'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck service
        run: pnpm --filter '${{ matrix.service }}' typecheck
      - name: Build service
        run: pnpm --filter '${{ matrix.service }}' build

  api-contracts:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate API contracts
        run: pnpm openapi:validate

  integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mms_procurement:mms_procurement@localhost:5434/procurement_db
      RABBITMQ_URL: amqp://mms:mms@localhost:5672
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start test infrastructure
        run: docker compose up -d inventory-test-db procurement-db rabbitmq
      - name: Wait for Inventory PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T inventory-test-db pg_isready -U mms_inventory -d inventory_test_db >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs inventory-test-db
              exit 1
            fi
            sleep 1
          done
      - name: Wait for Procurement PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T procurement-db pg_isready -U mms_procurement -d procurement_db >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs procurement-db
              exit 1
            fi
            sleep 1
          done
      - name: Wait for RabbitMQ
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs rabbitmq
              exit 1
            fi
            sleep 1
          done
      - name: Test Vendor Management
        run: pnpm --filter @mms/vendor-management test
      - name: Test Inventory
        run: pnpm --filter @mms/inventory test
      - name: Migrate Procurement test database
        run: pnpm --filter @mms/procurement db:migrate
      - name: Test Procurement
        run: pnpm --filter @mms/procurement test
      - name: Stop test infrastructure
        if: always()
        run: docker compose down

openapi: 3.0.3

info:
  title: MMS Inventory API
  description: |
    REST API for the Inventory Service in the Merchandising Funnel
    Automation system.

    Inventory is the authoritative service for the Product Master,
    inventory locations, stock quantities, stock allocation, stock
    adjustments, and inventory-related event processing.
  version: 1.0.0
  license:
    name: Proprietary
    url: https://vincent.com/license

security: []

servers:
  - url: http://localhost:3002
    description: Local development server

tags:
  - name: Health
    description: Service health and readiness
  - name: Products
    description: Product Master operations
  - name: Locations
    description: Inventory location operations
  - name: Stock
    description: Inventory stock operations
  - name: Adjustments
    description: Inventory stock adjustments
  - name: Events
    description: Internal event processing endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /ready:
    get:
      tags:
        - Health
      summary: Check service readiness
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products:
    post:
      tags:
        - Products
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"

    get:
      tags:
        - Products
      summary: List products
      operationId: listProducts
      parameters:
        - name: search
          in: query
          required: false
          description: Search by SKU or product name
          schema:
            type: string

        - name: status
          in: query
          required: false
          description: Filter products by status
          schema:
            $ref: "#/components/schemas/Status"

        - name: category
          in: query
          required: false
          description: Filter products by category
          schema:
            type: string

      responses:
        "200":
          description: Products returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get a product by ID
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Products
      summary: Update a product
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products/{id}/deactivate:
    patch:
      tags:
        - Products
      summary: Deactivate a product
      operationId: deactivateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products/{id}/reactivate:
    patch:
      tags:
        - Products
      summary: Reactivate a product
      operationId: reactivateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/locations:
    post:
      tags:
        - Locations
      summary: Create an inventory location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"

    get:
      tags:
        - Locations
      summary: List inventory locations
      operationId: listLocations
      parameters:
        - name: search
          in: query
          required: false
          description: Search by location code or name
          schema:
            type: string

        - name: locationType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LocationType"

        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"

      responses:
        "200":
          description: Locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/locations/{id}:
    get:
      tags:
        - Locations
      summary: Get a location by ID
      operationId: getLocation
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Locations
      summary: Update a location
      operationId: updateLocation
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/locations/{id}/deactivate:
    patch:
      tags:
        - Locations
      summary: Deactivate an inventory location
      operationId: deactivateLocation
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/locations/{id}/reactivate:
    patch:
      tags:
        - Locations
      summary: Reactivate an inventory location
      operationId: reactivateLocation
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/stock:
    post:
      tags:
        - Stock
      summary: Create a stock record
      operationId: createStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockRequest"
      responses:
        "201":
          description: Stock record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/stock/by-product-and-location:
    get:
      tags:
        - Stock
      summary: Get stock for a product at a location
      operationId: getStockByProductAndLocation
      parameters:
        - $ref: "#/components/parameters/ProductIdQuery"
        - $ref: "#/components/parameters/LocationIdQuery"
      responses:
        "200":
          description: Stock returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockWithAvailable"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/stock/by-product:
    get:
      tags:
        - Stock
      summary: Get stock records for a product
      operationId: getStockByProduct
      parameters:
        - $ref: "#/components/parameters/ProductIdQuery"
      responses:
        "200":
          description: Stock records returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockWithAvailable"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/stock/by-location:
    get:
      tags:
        - Stock
      summary: Get stock records at a location
      operationId: getStockByLocation
      parameters:
        - $ref: "#/components/parameters/LocationIdQuery"
      responses:
        "200":
          description: Stock records returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockWithAvailable"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/stock/allocate:
    post:
      tags:
        - Stock
      summary: Allocate available stock
      operationId: allocateStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockOperationRequest"
      responses:
        "200":
          description: Stock allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocateStockResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/stock/release:
    post:
      tags:
        - Stock
      summary: Release allocated stock
      operationId: releaseStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockOperationRequest"
      responses:
        "200":
          description: Stock allocation released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockWithAvailable"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/adjustments:
    post:
      tags:
        - Adjustments
      summary: Adjust stock quantity
      operationId: createAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdjustmentRequest"
      responses:
        "201":
          description: Stock adjustment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events/purchase-order-approved:
    post:
      tags:
        - Events
      summary: Process a PurchaseOrderApproved event
      description: |
        Internal endpoint used to process an approved purchase order event.
        The event increases quantity on order for the affected stock records.
      operationId: processPurchaseOrderApproved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderApprovedEvent"
      responses:
        "200":
          description: Event processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventProcessingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events/purchase-order-cancelled:
    post:
      tags:
        - Events
      summary: Process a PurchaseOrderCancelled event
      description: |
        Internal endpoint used to process a cancelled purchase order event.
        The event decreases quantity on order for the affected stock records.
      operationId: processPurchaseOrderCancelled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderCancelledEvent"
      responses:
        "200":
          description: Event processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventProcessingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid

    LocationId:
      name: id
      in: path
      required: true
      description: Location UUID
      schema:
        type: string
        format: uuid

    ProductIdQuery:
      name: productId
      in: query
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid

    LocationIdQuery:
      name: locationId
      in: query
      required: true
      description: Location UUID
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    ConflictError:
      description: Business operation conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Status:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    LocationType:
      type: string
      enum:
        - WAREHOUSE
        - STORE

    Product:
      type: object
      required:
        - id
        - sku
        - name
        - category
        - unitOfMeasure
        - status
        - reorderLevel
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        category:
          type: string
          maxLength: 100
        unitOfMeasure:
          type: string
          maxLength: 30
        barcode:
          type: string
          maxLength: 100
          nullable: true
        status:
          $ref: "#/components/schemas/Status"
        reorderLevel:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required:
        - sku
        - name
        - category
        - unitOfMeasure
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        category:
          type: string
          minLength: 1
          maxLength: 100
        unitOfMeasure:
          type: string
          minLength: 1
          maxLength: 30
        barcode:
          type: string
          maxLength: 100
        reorderLevel:
          type: integer
          minimum: 0
          default: 0

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        category:
          type: string
          minLength: 1
          maxLength: 100
        unitOfMeasure:
          type: string
          minLength: 1
          maxLength: 30
        barcode:
          type: string
          maxLength: 100
        reorderLevel:
          type: integer
          minimum: 0

    Location:
      type: object
      required:
        - id
        - locationCode
        - name
        - locationType
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        locationCode:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 255
        locationType:
          $ref: "#/components/schemas/LocationType"
        status:
          $ref: "#/components/schemas/Status"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLocationRequest:
      type: object
      required:
        - locationCode
        - name
        - locationType
      properties:
        locationCode:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 255
        locationType:
          $ref: "#/components/schemas/LocationType"

    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        locationType:
          $ref: "#/components/schemas/LocationType"

    Stock:
      type: object
      required:
        - id
        - productId
        - locationId
        - quantityOnHand
        - quantityAllocated
        - quantityOnOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
          minimum: 0
        quantityAllocated:
          type: integer
          minimum: 0
        quantityOnOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StockWithAvailable:
      allOf:
        - $ref: "#/components/schemas/Stock"
        - type: object
          required:
            - quantityAvailable
          properties:
            quantityAvailable:
              type: integer
              minimum: 0
              description: Quantity on hand minus quantity allocated

    CreateStockRequest:
      type: object
      required:
        - productId
        - locationId
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid

    StockOperationRequest:
      type: object
      required:
        - productId
        - locationId
        - quantity
        - actorId
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        actorId:
          type: string
          format: uuid
        reference:
          type: string
          maxLength: 100

    AllocateStockResponse:
      type: object
      required:
        - stock
        - stockLowEvent
      properties:
        stock:
          $ref: "#/components/schemas/StockWithAvailable"
        stockLowEvent:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StockLowEvent"

    CreateAdjustmentRequest:
      type: object
      required:
        - productId
        - locationId
        - quantityChange
        - reason
        - createdBy
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantityChange:
          type: integer
          description: Positive or negative stock quantity change, but not zero
        reason:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          type: string
          maxLength: 100
        createdBy:
          type: string
          format: uuid

    Adjustment:
      type: object
      required:
        - id
        - productId
        - locationId
        - quantityChange
        - reason
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantityChange:
          type: integer
        reason:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 100
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    AdjustmentResponse:
      type: object
      required:
        - stock
        - adjustment
        - stockLowEvent
      properties:
        stock:
          $ref: "#/components/schemas/StockWithAvailable"
        adjustment:
          $ref: "#/components/schemas/Adjustment"
        stockLowEvent:
          allOf:
            - $ref: "#/components/schemas/StockLowEvent"
          type: object
          nullable: true

    StockLowEvent:
      type: object
      required:
        - id
        - eventId
        - eventType
        - aggregateType
        - aggregateId
        - payload
        - status
        - attempts
        - occurredAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          example: StockLow
        aggregateType:
          type: string
          example: PRODUCT
        aggregateId:
          type: string
          format: uuid
        payload:
          $ref: "#/components/schemas/StockLowEventPayload"
        status:
          type: string
          example: PENDING
        attempts:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    StockLowEventPayload:
      type: object
      required:
        - eventId
        - eventType
        - productId
        - locationId
        - quantityOnHand
        - quantityAllocated
        - quantityAvailable
        - reorderLevel
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          example: StockLow
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
          minimum: 0
        quantityAllocated:
          type: integer
          minimum: 0
        quantityAvailable:
          type: integer
          minimum: 0
        reorderLevel:
          type: integer
          minimum: 0

    PurchaseOrderApprovedEvent:
      type: object
      required:
        - eventId
        - eventType
        - purchaseOrderId
        - lines
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          example: PurchaseOrderApproved
        purchaseOrderId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseOrderApprovedLine"

    PurchaseOrderApprovedLine:
      type: object
      required:
        - productId
        - locationId
        - quantityOrdered
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantityOrdered:
          type: integer
          minimum: 1

    PurchaseOrderCancelledEvent:
      type: object
      required:
        - eventId
        - eventType
        - purchaseOrderId
        - lines
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          example: PurchaseOrderCancelled
        purchaseOrderId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseOrderCancelledLine"

    PurchaseOrderCancelledLine:
      type: object
      required:
        - productId
        - locationId
        - quantityRemaining
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantityRemaining:
          type: integer
          minimum: 1

    EventProcessingResponse:
      type: object
      required:
        - processed
      properties:
        processed:
          type: boolean
        reason:
          type: string
          example: Event already processed
        eventId:
          type: string
          format: uuid
        purchaseOrderId:
          type: string
          format: uuid

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: inventory

    ReadyResponse:
      type: object
      required:
        - status
        - service
        - dependencies
      properties:
        status:
          type: string
          example: ready
        service:
          type: string
          example: inventory
        dependencies:
          type: object
          required:
            - database
            - rabbitmq
          properties:
            database:
              type: string
              example: ok
            rabbitmq:
              type: string
              example: ok

    NotReadyResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: not_ready
        service:
          type: string
          example: inventory

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
